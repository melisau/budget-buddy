name: Android app bundle

# Builds the Google Play bundle (.aab) for the Trusted Web Activity in android/.
#  - Pull requests touching android/: unsigned build, to prove it compiles.
#  - Manual run (Actions > Android app bundle > Run workflow): signed with the
#    upload key from repository secrets and uploaded as a downloadable artifact.
# The upload key is never stored in the repository (it is public).

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (integer, must increase on every Play upload)"
        required: true
        default: "1"
      versionName:
        description: "versionName shown to users"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore upload key
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Fail if a manual run has no upload key
        if: github.event_name == 'workflow_dispatch' && env.HAS_KEY != 'true'
        run: |
          echo "::error::Add the ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD repository secrets first."
          exit 1

      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          gradle --no-daemon bundleRelease \
            -PversionCode="${{ inputs.versionCode || '1' }}" \
            -PversionName="${{ inputs.versionName || '1.0.0' }}"
          ls -la app/build/outputs/bundle/release/

      - name: Verify signature and show upload key fingerprint
        if: env.ANDROID_UPLOAD_KEYSTORE_PATH != ''
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
          FINGERPRINT=$(keytool -list -v -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" | awk '/SHA256:/ {print $2; exit}')
          {
            echo "### Signed bundle ready"
            echo "- versionCode: \`${{ inputs.versionCode }}\`, versionName: \`${{ inputs.versionName }}\`"
            echo "- Upload key SHA-256: \`$FINGERPRINT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ANDROID_UPLOAD_KEYSTORE_PATH"

      - name: Upload signed bundle
        if: env.ANDROID_UPLOAD_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: budgetbuddy-${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
