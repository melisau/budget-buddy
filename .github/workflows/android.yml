name: Android app bundle

# Builds the Google Play bundle (.aab) for the Flutter app in apps/mobile.
#  - Pull requests touching the Flutter app: analyze, test, and an unsigned build.
#  - Manual run (Actions > Android app bundle > Run workflow): signed with the
#    upload key from repository secrets and uploaded as a downloadable artifact.
# The upload key is never stored in the repository (it is public). The manual
# run inputs are public client settings that the website already serves.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode (integer, must increase on every Play upload)"
        required: true
        default: "100"
      versionName:
        description: "versionName shown to users"
        required: true
        default: "1.1.0"
      apiUrl:
        description: "Public site URL"
        required: true
        default: "https://budgetbuddy.melisauyar.com"
      supabaseUrl:
        description: "Public Supabase project URL"
        required: true
      supabasePublishableKey:
        description: "Supabase publishable key (never a secret key)"
        required: true
      googleWebClientId:
        description: "Public Google web client ID"
        required: true
      receiptScanEnabled:
        description: "Enable receipt scanning (internal test builds only)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_OPTS: '"-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v6

      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart analyze lib test
          flutter test

      - name: Check manual run settings
        if: github.event_name == 'workflow_dispatch'
        env:
          API_URL: ${{ inputs.apiUrl }}
          SUPABASE_URL: ${{ inputs.supabaseUrl }}
          SUPABASE_KEY: ${{ inputs.supabasePublishableKey }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the ANDROID_UPLOAD_KEYSTORE_BASE64 and ANDROID_UPLOAD_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
          case "$API_URL" in https://*) ;; *) echo "::error::apiUrl must use https."; exit 1 ;; esac
          case "$SUPABASE_URL" in https://*) ;; *) echo "::error::supabaseUrl must use https."; exit 1 ;; esac
          case "$SUPABASE_KEY" in sb_publishable_*) ;; *) echo "::error::Use the Supabase publishable key."; exit 1 ;; esac

      - name: Restore upload key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"

      - name: Build release bundle
        working-directory: apps/mobile
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VERSION_CODE: ${{ inputs.versionCode || '100' }}
          VERSION_NAME: ${{ inputs.versionName || '1.1.0' }}
          API_URL: ${{ inputs.apiUrl }}
          SUPABASE_URL: ${{ inputs.supabaseUrl }}
          SUPABASE_KEY: ${{ inputs.supabasePublishableKey }}
          GOOGLE_ID: ${{ inputs.googleWebClientId }}
          RECEIPT_SCAN: ${{ inputs.receiptScanEnabled == true }}
        run: |
          flutter build appbundle --release \
            --build-number="$VERSION_CODE" \
            --build-name="$VERSION_NAME" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_ID" \
            --dart-define=RECEIPT_SCAN_ENABLED="$RECEIPT_SCAN"
          ls -la build/app/outputs/bundle/release/

      - name: Verify signature and show upload key fingerprint
        if: env.ANDROID_UPLOAD_KEYSTORE_PATH != ''
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          jarsigner -verify apps/mobile/build/app/outputs/bundle/release/app-release.aab | tail -1
          FINGERPRINT=$(keytool -list -v -keystore "$ANDROID_UPLOAD_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" | awk '/SHA256:/ {print $2; exit}')
          {
            echo "### Signed bundle ready"
            echo "- versionCode: \`$VERSION_CODE\`, versionName: \`$VERSION_NAME\`"
            echo "- Upload key SHA-256: \`$FINGERPRINT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ANDROID_UPLOAD_KEYSTORE_PATH"

      - name: Upload signed bundle
        if: env.ANDROID_UPLOAD_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          name: budgetbuddy-${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
