minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  bufferutil: false
  core-js: set this to true or false
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
# Security fixes for transitive dependencies (pnpm audit, 2026-11-27).
# Remove an entry once the parent package ships the fixed version itself.
overrides:
  fast-uri: ">=3.1.9 <4"
  browserslist: ">=4.28.7 <5"
  source-map-js: ">=1.2.2 <2"
  baseline-browser-mapping: ">=2.11.0 <3"
  "@babel/core": ">=7.29.1 <8"
  # Build and lint tooling only (not shipped to the browser).
  "js-yaml@4": ">=4.1.2 <5"
  "brace-expansion@1": ">=1.1.16 <2"
  "nanoid@3": ">=3.3.16 <4"
  postcss: ">=8.5.23 <9"
  "minimatch@11": ">=11.0.1 <12"
  "minimatch@10": ">=11.0.1 <12"
